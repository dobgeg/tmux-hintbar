# An example keys file: copy it to ~/.config/tmux-hintbar/keys.conf.
#
# [+prefix] puts these before the default prefix hints, replacing the
# defaults for the same keys (| and -).

[+prefix]
bind |  SPLIT RIGHT  split-window -h -c "#{pane_current_path}"
bind -  SPLIT DOWN   split-window -v -c "#{pane_current_path}"
bind -r H  RESIZE LEFT   resize-pane -L 5
bind -r L  RESIZE RIGHT  resize-pane -R 5

# Alt-arrows switch panes without the prefix: one hint for four bindings,
# so each binding's label is - (no hint of its own).
[+root]
Alt-←↓↑→  FOCUS
bind M-Left  -  select-pane -L
bind M-Down  -  select-pane -D
bind M-Up  -  select-pane -U
bind M-Right  -  select-pane -R
