# @hintbar-extra-vi: read after defaults.conf, before your keys file.
#
# Unlike yours, these bind lines only take a key that's free, stock or
# still hintbar's. "- note" labels bind without their own hint (the hint
# lines describe them in groups) but keep the note for prefix ?.

[prefix]
bind |  - Split side by side, in the current directory  split-window -h -c "#{pane_current_path}"
bind -  - Split top and bottom, in the current directory  split-window -v -c "#{pane_current_path}"
bind h  - Select the pane to the left  select-pane -L
bind j  - Select the pane below  select-pane -D
bind k  - Select the pane above  select-pane -U
bind l  - Select the pane to the right  select-pane -R
bind -r H  - Resize the pane left by 5  resize-pane -L 5
bind -r J  - Resize the pane down by 5  resize-pane -D 5
bind -r K  - Resize the pane up by 5  resize-pane -U 5
bind -r L  - Resize the pane right by 5  resize-pane -R 5
bind v  - Enter copy mode  copy-mode
| -  SPLIT
hjkl  FOCUS
z  ZOOM
x  CLOSE
HJKL  RESIZE
c  WINDOW
n p  NEXT PREV
0-9  GO TO WINDOW
w  WINDOWS
v  COPY MODE
]  PASTE
---
o  NEXT PANE
;  LAST PANE
,  RENAME
{ }  SWAP
!  BREAK OUT
Space  NEXT LAYOUT
q  PANE NUMBERS
&  KILL WINDOW
f  FIND
m M  MARK UNMARK
E  EVEN OUT
Ctrl-o Alt-o  ROTATE
Alt-←↓↑→  RESIZE BY 5
Alt-1…7  LAYOUTS
.  MOVE WINDOW
'  WINDOW BY NUMBER
>  PANE MENU
---
s  SESSIONS
$  RENAME SESSION
d  DETACH
D  CLIENTS
( )  PREV NEXT CLIENT
Ctrl-z  SUSPEND
---
?  HELP
:  COMMAND
r  RELOAD
=  BUFFERS
\#  LIST BUFFERS
PgUp  SCROLL UP
C  OPTIONS
/  DESCRIBE KEY
~  MESSAGES
i  WINDOW INFO
<  WINDOW MENU
Alt-n Alt-p  NEXT PREV ALERT
t  CLOCK
{send-prefix}  SEND PREFIX
Shift-←↓↑→  PAN VIEW
Delete  FOLLOW CURSOR

[copy-mode-vi]
bind v  - Start selecting  send-keys -X begin-selection
bind y  - Copy the selection and leave copy mode  send-keys -X copy-pipe-and-cancel
v  SELECT
y  YANK
q  EXIT
hjkl  MOVE
Ctrl-u Ctrl-d  PAGE
g G  TOP END
/ ?  SEARCH
V  LINE
Ctrl-v  BLOCK
n N  NEXT PREV
