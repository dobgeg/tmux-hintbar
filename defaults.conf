# Hints for stock tmux. Your keys file is read after this; a [section]
# there replaces the one here, a [+section] adds to it. Syntax: README.
#
# Order is priority: hints drop from the end when a row doesn't fit. The
# prefix row leads with pane and window controls; NORMAL's preview of it
# leads with session-level keys (@hintbar-preview-first).

# NORMAL shows the prefix and a preview of [prefix]; hints here follow it.
[root] NORMAL

[prefix] TMUX
% "  SPLIT
←↓↑→  FOCUS
z  ZOOM
x  CLOSE
Ctrl-←↓↑→  RESIZE
c  WINDOW
n p  NEXT PREV
0-9  GO TO WINDOW
w  WINDOWS
[  COPY MODE
]  PASTE
---
o  NEXT PANE
;  LAST PANE
l  LAST WINDOW
,  RENAME
{ }  SWAP
!  BREAK OUT
Space  NEXT LAYOUT
q  PANE NUMBERS
&  KILL WINDOW
f  FIND
m M  MARK UNMARK
E  EVEN OUT
Ctrl-o Alt-o  ROTATE
Alt-←↓↑→  RESIZE BY 5
Alt-1…7  LAYOUTS
.  MOVE WINDOW
'  WINDOW BY NUMBER
>  PANE MENU
---
s  SESSIONS
$  RENAME SESSION
d  DETACH
D  CLIENTS
( )  PREV NEXT CLIENT
L  LAST CLIENT
Ctrl-z  SUSPEND
---
?  HELP
:  COMMAND
r  RELOAD
=  BUFFERS
\#  LIST BUFFERS
-  DELETE BUFFER
PgUp  SCROLL UP
C  OPTIONS
/  DESCRIBE KEY
~  MESSAGES
i  WINDOW INFO
<  WINDOW MENU
Alt-n Alt-p  NEXT PREV ALERT
t  CLOCK
{send-prefix}  SEND PREFIX
Shift-←↓↑→  PAN VIEW
Delete  FOLLOW CURSOR

# Copy mode: the section matching tmux's mode-keys is shown.
[copy-mode] COPY
Ctrl-Space  SELECT
Alt-w  COPY
q  EXIT
←↓↑→  MOVE
Alt-v Ctrl-v  PAGE
Alt-< Alt->  TOP END
Ctrl-s Ctrl-r  SEARCH
R  BLOCK
n N  NEXT PREV

[copy-mode-vi] COPY
Space  SELECT
Enter  YANK
q  EXIT
hjkl  MOVE
Ctrl-u Ctrl-d  PAGE
g G  TOP END
/ ?  SEARCH
V  LINE
v  BLOCK
n N  NEXT PREV

# Other pane modes: keys built into tmux, matched by mode (no key tables).
# F1 in each lists everything.
[tree-mode] TREE
Enter  CHOOSE
↑↓  MOVE
q  EXIT
x  KILL
+ -  EXPAND COLLAPSE
t  TAG
Ctrl-s  SEARCH
f  FILTER
m  MARK
v  PREVIEW
O  SORT
F1  HELP

[buffer-mode] BUFFERS
Enter  PASTE
↑↓  MOVE
q  EXIT
d  DELETE
e  EDIT
t  TAG
P  PASTE TAGGED
Ctrl-s  SEARCH
v  PREVIEW
F1  HELP

[client-mode] CLIENTS
Enter  CHOOSE
↑↓  MOVE
q  EXIT
d  DETACH
z  SUSPEND
t  TAG
F1  HELP

[options-mode] OPTIONS
Enter  SET
↑↓  MOVE
q  EXIT
+ -  EXPAND COLLAPSE
d  DEFAULT
u  UNSET
Ctrl-s  SEARCH
v  INFO
F1  HELP

[clock-mode] CLOCK
any key  EXIT
